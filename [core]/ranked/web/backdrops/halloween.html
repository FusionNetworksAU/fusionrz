<!doctype html>
<html>
	<head>
		<meta charset="UTF-8">
		<!-- Halloween: haunted house, harvest moon, bats, lanterns and ground fog. Layout notes: common.js. -->
		<style>
			html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #140a1c; }
			svg, canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
		</style>
		<script src="common.js"></script>
	</head>
	<body>
		<svg viewBox="0 0 1920 1096" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
			<defs>
				<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
					<stop offset="0" stop-color="#0e0618" />
					<stop offset="0.35" stop-color="#25103d" />
					<stop offset="0.55" stop-color="#4a1f5c" />
					<stop offset="0.63" stop-color="#8a3d4a" />
				</linearGradient>
				<radialGradient id="moonGlow">
					<stop offset="0" stop-color="#ffb347" stop-opacity="0.5" />
					<stop offset="0.4" stop-color="#ff7a2e" stop-opacity="0.15" />
					<stop offset="1" stop-color="#ff7a2e" stop-opacity="0" />
				</radialGradient>
				<radialGradient id="moon" cx="0.4" cy="0.4" r="0.7">
					<stop offset="0" stop-color="#ffe2a8" />
					<stop offset="1" stop-color="#f59a3c" />
				</radialGradient>
				<linearGradient id="hills" gradientUnits="userSpaceOnUse" x1="0" y1="560" x2="0" y2="700">
					<stop offset="0" stop-color="#3a1a4e" />
					<stop offset="1" stop-color="#1e0d2a" />
				</linearGradient>
				<linearGradient id="ground" gradientUnits="userSpaceOnUse" x1="0" y1="650" x2="0" y2="1096">
					<stop offset="0" stop-color="#2c1438" />
					<stop offset="0.4" stop-color="#1e0c27" />
					<stop offset="1" stop-color="#0f0615" />
				</linearGradient>
				<radialGradient id="lanternSpill">
					<stop offset="0" stop-color="#ff8a2a" stop-opacity="0.45" />
					<stop offset="1" stop-color="#ff8a2a" stop-opacity="0" />
				</radialGradient>
				<radialGradient id="shadow">
					<stop offset="0" stop-color="#000000" stop-opacity="0.5" />
					<stop offset="1" stop-color="#000000" stop-opacity="0" />
				</radialGradient>
				<radialGradient id="vignette" cx="0.5" cy="0.55" r="0.62">
					<stop offset="0.55" stop-color="#05020a" stop-opacity="0" />
					<stop offset="1" stop-color="#05020a" stop-opacity="0.8" />
				</radialGradient>
			</defs>

			<rect width="1920" height="1096" fill="url(#sky)" />
			<g id="stars"></g>

			<circle cx="680" cy="430" r="200" fill="url(#moonGlow)" />
			<circle cx="680" cy="430" r="62" fill="url(#moon)" />
			<circle cx="660" cy="415" r="9" fill="#e9a050" opacity="0.5" />
			<circle cx="702" cy="448" r="12" fill="#e9a050" opacity="0.4" />
			<circle cx="690" cy="404" r="5" fill="#e9a050" opacity="0.5" />

			<path fill="url(#hills)" d="M0 680 Q 240 590 520 640 T 1000 630 T 1500 610 T 1920 650 L1920 720 L0 720 Z" />

			<!-- Haunted house, on a rise to the right of the party. -->
			<g id="house" fill="#120818">
				<path d="M1040 700 Q 1180 650 1360 700 Z" fill="#1a0b22" />
				<rect x="1090" y="560" width="210" height="140" />
				<path d="M1078 566 L1195 470 L1312 566 Z" />
				<rect x="1250" y="420" width="62" height="190" />
				<path d="M1240 426 L1281 345 L1322 426 Z" />
				<rect x="1278" y="330" width="5" height="22" />
				<rect x="1108" y="500" width="22" height="60" />
				<path d="M1090 700 L1086 712 L1306 712 L1300 700 Z" />
				<!-- Broken fence. -->
				<g stroke="#120818" stroke-width="5">
					<line x1="1010" y1="712" x2="1010" y2="682" /><line x1="1030" y1="712" x2="1032" y2="680" />
					<line x1="1050" y1="712" x2="1048" y2="686" /><line x1="1340" y1="712" x2="1340" y2="680" />
					<line x1="1360" y1="712" x2="1363" y2="684" /><line x1="1380" y1="712" x2="1378" y2="690" />
					<line x1="1000" y1="694" x2="1060" y2="692" /><line x1="1332" y1="692" x2="1390" y2="698" />
				</g>
			</g>
			<g id="houseWindows" fill="#ffb347">
				<rect x="1112" y="590" width="30" height="36" />
				<rect x="1170" y="590" width="30" height="36" />
				<rect x="1232" y="590" width="30" height="36" />
				<rect x="1266" y="460" width="30" height="34" />
				<path d="M1180 520 a 15 15 0 0 1 30 0 v 14 h -30 Z" />
				<rect x="1176" y="650" width="34" height="50" fill="#2a1630" />
			</g>
			<g stroke="#120818" stroke-width="3">
				<path d="M1127 590 V626 M1112 608 H1142 M1185 590 V626 M1170 608 H1200 M1247 590 V626 M1232 608 H1262 M1281 460 V494 M1266 477 H1296" />
			</g>

			<path fill="url(#ground)" d="M0 690 Q 360 670 760 690 T 1500 700 T 1920 690 L1920 1096 L0 1096 Z" />

			<ellipse cx="1195" cy="740" rx="200" ry="30" fill="url(#lanternSpill)" opacity="0.6" />

			<!-- Dead trees, left. -->
			<g id="deadTrees" stroke="#0c0510" stroke-linecap="round" fill="none"></g>

			<!-- Graves. -->
			<g fill="#3d2b4a" stroke="#1a0f22" stroke-width="3">
				<path d="M740 760 v -46 a 22 22 0 0 1 44 0 v 46 Z" />
				<path d="M800 752 v -32 a 16 16 0 0 1 32 0 v 32 Z" transform="rotate(-6 816 752)" />
				<path d="M1050 768 v -40 a 20 20 0 0 1 40 0 v 40 Z" transform="rotate(5 1070 768)" />
				<path d="M1460 780 h 16 v -40 h 16 v -16 h -16 v -18 h -16 v 18 h -16 v 16 h 16 Z" />
			</g>
			<g fill="#2a1d34" opacity="0.8">
				<ellipse cx="762" cy="762" rx="34" ry="6" /><ellipse cx="816" cy="754" rx="26" ry="5" />
				<ellipse cx="1070" cy="770" rx="30" ry="6" /><ellipse cx="1484" cy="782" rx="30" ry="6" />
			</g>

			<!-- Jack-o'-lanterns; their glow flickers on the canvas. -->
			<g id="pumpkins"></g>

			<ellipse cx="930" cy="772" rx="110" ry="18" fill="url(#shadow)" />
			<rect width="1920" height="1096" fill="url(#vignette)" />
		</svg>

		<canvas id="fx"></canvas>

		<script>
			(function () {
				var B = window.Backdrop;
				var rand = B.rand;

				var twinklers = B.stars(document.getElementById('stars'), 110, { x: 380, y: 280, w: 1300, h: 240 }, 5);

				// A bare tree: trunk and recursive crooked branches.
				var deadTrees = document.getElementById('deadTrees');
				function branch(x, y, angle, length, width, depth) {
					var x2 = x + Math.cos(angle) * length;
					var y2 = y + Math.sin(angle) * length;
					var bend = (rand() - 0.5) * length * 0.4;
					B.el('path', {
						d: 'M' + x + ' ' + y + ' Q ' + ((x + x2) / 2 + bend) + ' ' + ((y + y2) / 2) + ' ' + x2 + ' ' + y2,
						'stroke-width': width
					}, deadTrees);
					if (depth > 0) {
						branch(x2, y2, angle - 0.35 - rand() * 0.4, length * 0.7, width * 0.62, depth - 1);
						branch(x2, y2, angle + 0.3 + rand() * 0.4, length * 0.66, width * 0.62, depth - 1);
					}
				}
				branch(560, 780, -Math.PI / 2 + 0.05, 150, 22, 5);
				branch(690, 740, -Math.PI / 2 - 0.12, 95, 13, 4);
				branch(1500, 760, -Math.PI / 2 - 0.08, 120, 16, 4);

				var pumpkinSpots = [[700, 790, 1.2], [790, 800, 0.9], [1140, 742, 0.8], [1250, 748, 1.0], [1080, 800, 1.1]];
				var pumpkins = document.getElementById('pumpkins');
				pumpkinSpots.forEach(function (p) {
					var g = B.el('g', { transform: 'translate(' + p[0] + ' ' + p[1] + ') scale(' + p[2] + ')' }, pumpkins);
					B.el('ellipse', { cx: 0, cy: 6, rx: 34, ry: 6, fill: '#000', opacity: 0.35 }, g);
					B.el('rect', { x: -3, y: -36, width: 6, height: 10, rx: 2, fill: '#3b5a1e' }, g);
					B.el('ellipse', { cx: -12, cy: -14, rx: 16, ry: 20, fill: '#d9661c' }, g);
					B.el('ellipse', { cx: 12, cy: -14, rx: 16, ry: 20, fill: '#d9661c' }, g);
					B.el('ellipse', { cx: 0, cy: -14, rx: 17, ry: 22, fill: '#ec7a26' }, g);
					B.el('path', { d: 'M-14 -20 l6 -8 l6 8 Z M2 -20 l6 -8 l6 8 Z M-14 -8 q 14 10 28 0 l -5 6 l -4 -3 l -5 4 l -5 -4 l -4 3 Z', fill: '#ffd36b' }, g);
				});

				// Bats: a flapping silhouette each, flying loose loops.
				var bats = [];
				for (var b = 0; b < 9; b++) {
					bats.push({
						cx: 600 + rand() * 900,
						cy: 380 + rand() * 180,
						rx: 60 + rand() * 220,
						ry: 20 + rand() * 60,
						speed: (0.12 + rand() * 0.2) * (rand() < 0.5 ? -1 : 1),
						phase: rand() * Math.PI * 2,
						size: 0.6 + rand() * 0.7,
						flap: 9 + rand() * 6
					});
				}

				function drawBat(ctx, x, y, size, wing) {
					ctx.save();
					ctx.translate(x, y);
					ctx.scale(size, size);
					ctx.fillStyle = '#0b0410';
					ctx.beginPath();
					ctx.moveTo(0, 0);
					ctx.quadraticCurveTo(-10, -12 * wing, -26, -6 * wing);
					ctx.quadraticCurveTo(-18, 0, -20, 6);
					ctx.quadraticCurveTo(-10, 2, 0, 6);
					ctx.quadraticCurveTo(10, 2, 20, 6);
					ctx.quadraticCurveTo(18, 0, 26, -6 * wing);
					ctx.quadraticCurveTo(10, -12 * wing, 0, 0);
					ctx.fill();
					ctx.beginPath();
					ctx.arc(0, 2, 4, 0, Math.PI * 2);
					ctx.fill();
					ctx.restore();
				}

				// Ground fog: wide soft bands sliding slowly sideways.
				var fog = [];
				for (var f = 0; f < 7; f++) {
					fog.push({ x: rand() * 1920, y: 700 + rand() * 140, r: 220 + rand() * 200, speed: 10 + rand() * 18, a: 0.08 + rand() * 0.07 });
				}

				var embers = B.makeFall({
					rise: true,
					colour: '#ffa040',
					wind: 6,
					minX: 480,
					maxX: 1600,
					layers: [
						{ count: 30, size: [0.8, 1.8], speed: [10, 22], alpha: 0.6 },
						{ count: 14, size: [1.8, 2.8], speed: [18, 34], alpha: 0.8 }
					]
				});

				var windows = [[1127, 608, 46], [1185, 608, 46], [1247, 608, 46], [1281, 477, 40], [1195, 526, 30]];

				B.run(function (ctx, dt, time) {
					B.drawTwinkle(ctx, twinklers, time);

					for (var i = 0; i < bats.length; i++) {
						var bat = bats[i];
						var a = time * bat.speed * Math.PI * 2 + bat.phase;
						var wing = Math.sin(time * bat.flap + i) > 0 ? 1 : -0.4;
						drawBat(ctx, bat.cx + Math.cos(a) * bat.rx, bat.cy + Math.sin(a * 2) * bat.ry, bat.size, wing);
					}

					// Windows flicker between candle orange and an odd green.
					for (var w = 0; w < windows.length; w++) {
						var win = windows[w];
						var flick = 0.2 + 0.1 * Math.sin(time * 6.1 + w * 1.7) + 0.06 * Math.sin(time * 17 + w);
						var green = w === 3 && Math.sin(time * 0.7) > 0.6;
						B.glow(ctx, win[0], win[1], win[2], green ? '120, 255, 140' : '255, 160, 60', flick);
					}

					for (var p = 0; p < pumpkinSpots.length; p++) {
						var spot = pumpkinSpots[p];
						var lit = 0.35 + 0.15 * Math.sin(time * 8 + p * 2.3) + 0.08 * Math.sin(time * 21 + p);
						B.glow(ctx, spot[0], spot[1] - 14 * spot[2], 46 * spot[2], '255, 150, 40', lit);
					}

					for (var g = 0; g < fog.length; g++) {
						var band = fog[g];
						band.x += band.speed * dt;
						if (band.x - band.r > 1920) {
							band.x = -band.r;
						}
						ctx.save();
						ctx.translate(band.x, band.y);
						ctx.scale(1, 0.18);
						var grad = ctx.createRadialGradient(0, 0, 0, 0, 0, band.r);
						grad.addColorStop(0, 'rgba(190, 160, 220, ' + band.a + ')');
						grad.addColorStop(1, 'rgba(190, 160, 220, 0)');
						ctx.fillStyle = grad;
						ctx.fillRect(-band.r, -band.r, band.r * 2, band.r * 2);
						ctx.restore();
					}

					embers(ctx, dt, time);
				});
			})();
		</script>
	</body>
</html>
