<!doctype html>
<html>
	<head>
		<meta charset="UTF-8">
		<!-- Winter cabin at night with falling snow. Layout notes: common.js. -->
		<style>
			html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1a1030; }
			svg, canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
		</style>
		<script src="common.js"></script>
	</head>
	<body>
		<svg viewBox="0 0 1920 1096" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
			<defs>
				<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
					<stop offset="0" stop-color="#120a24" />
					<stop offset="0.35" stop-color="#24154a" />
					<stop offset="0.55" stop-color="#3d2670" />
					<stop offset="0.62" stop-color="#5a3d8f" />
				</linearGradient>
				<radialGradient id="moonGlow">
					<stop offset="0" stop-color="#e9ddff" stop-opacity="0.45" />
					<stop offset="0.35" stop-color="#b79cff" stop-opacity="0.15" />
					<stop offset="1" stop-color="#b79cff" stop-opacity="0" />
				</radialGradient>
				<linearGradient id="farRange" gradientUnits="userSpaceOnUse" x1="0" y1="470" x2="0" y2="640">
					<stop offset="0" stop-color="#a99ad6" />
					<stop offset="0.35" stop-color="#6c5a9e" />
					<stop offset="1" stop-color="#3a2a5e" />
				</linearGradient>
				<linearGradient id="nearRange" gradientUnits="userSpaceOnUse" x1="0" y1="570" x2="0" y2="680">
					<stop offset="0" stop-color="#7d6db0" />
					<stop offset="0.4" stop-color="#4a3a7a" />
					<stop offset="1" stop-color="#2a1e45" />
				</linearGradient>
				<linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
					<stop offset="0" stop-color="#c9bdf0" stop-opacity="0" />
					<stop offset="0.5" stop-color="#c9bdf0" stop-opacity="0.32" />
					<stop offset="1" stop-color="#c9bdf0" stop-opacity="0" />
				</linearGradient>
				<linearGradient id="ground" gradientUnits="userSpaceOnUse" x1="0" y1="640" x2="0" y2="1096">
					<stop offset="0" stop-color="#e4def6" />
					<stop offset="0.35" stop-color="#c7bde6" />
					<stop offset="1" stop-color="#8e82bd" />
				</linearGradient>
				<radialGradient id="warmSpill">
					<stop offset="0" stop-color="#ffb35c" stop-opacity="0.55" />
					<stop offset="1" stop-color="#ffb35c" stop-opacity="0" />
				</radialGradient>
				<radialGradient id="shadow">
					<stop offset="0" stop-color="#2a1a45" stop-opacity="0.45" />
					<stop offset="1" stop-color="#2a1a45" stop-opacity="0" />
				</radialGradient>
				<linearGradient id="logs" x1="0" y1="0" x2="0" y2="1">
					<stop offset="0" stop-color="#6b4532" />
					<stop offset="1" stop-color="#47291d" />
				</linearGradient>
				<linearGradient id="roofSnow" x1="0" y1="0" x2="0" y2="1">
					<stop offset="0" stop-color="#ffffff" />
					<stop offset="1" stop-color="#d6cfee" />
				</linearGradient>
				<radialGradient id="vignette" cx="0.5" cy="0.55" r="0.62">
					<stop offset="0.6" stop-color="#0a0414" stop-opacity="0" />
					<stop offset="1" stop-color="#0a0414" stop-opacity="0.7" />
				</radialGradient>
			</defs>

			<rect width="1920" height="1096" fill="url(#sky)" />
			<g id="stars"></g>

			<circle cx="660" cy="410" r="170" fill="url(#moonGlow)" />
			<circle cx="660" cy="410" r="40" fill="#f4eeff" />
			<circle cx="648" cy="400" r="7" fill="#ddd2f5" />
			<circle cx="672" cy="424" r="5" fill="#e3d9f7" />

			<path fill="url(#farRange)" d="M0 660 L120 560 L260 610 L420 505 L560 590 L700 520 L860 600 L990 485 L1120 580 L1260 515 L1420 600 L1560 475 L1720 570 L1920 520 L1920 680 L0 680 Z" />
			<path fill="url(#nearRange)" d="M0 675 L200 605 L340 640 L520 575 L700 650 L880 610 L1060 655 L1260 600 L1460 645 L1660 590 L1920 640 L1920 690 L0 690 Z" />
			<rect x="0" y="600" width="1920" height="110" fill="url(#mist)" />

			<g id="farTrees"></g>

			<path fill="url(#ground)" d="M0 668 Q 300 640 620 662 T 1240 660 T 1920 652 L1920 1096 L0 1096 Z" />

			<g id="backTrees"></g>

			<g id="cabin">
				<ellipse cx="1150" cy="745" rx="120" ry="34" fill="url(#warmSpill)" />
				<ellipse cx="1262" cy="745" rx="110" ry="30" fill="url(#warmSpill)" />

				<rect x="1252" y="508" width="26" height="80" fill="#3f2a22" />
				<rect x="1248" y="502" width="34" height="10" rx="3" fill="#f3efff" />

				<rect x="1110" y="600" width="190" height="110" fill="url(#logs)" />
				<g stroke="#3a2117" stroke-width="2" opacity="0.7">
					<line x1="1110" y1="614" x2="1300" y2="614" />
					<line x1="1110" y1="628" x2="1300" y2="628" />
					<line x1="1110" y1="642" x2="1300" y2="642" />
					<line x1="1110" y1="656" x2="1300" y2="656" />
					<line x1="1110" y1="670" x2="1300" y2="670" />
					<line x1="1110" y1="684" x2="1300" y2="684" />
					<line x1="1110" y1="698" x2="1300" y2="698" />
				</g>
				<g id="logEnds" fill="#5a3726"></g>

				<path d="M1110 600 L1205 525 L1300 600 Z" fill="#55331f" />
				<path d="M1082 614 L1205 508 L1328 614 L1316 620 L1205 526 L1094 620 Z" fill="#3a2218" />
				<path d="M1078 612 L1205 500 L1332 612 Q 1334 622 1322 620 Q 1300 612 1290 618 Q 1270 606 1250 590 L1205 538 L1160 590 Q 1140 606 1120 618 Q 1108 612 1088 620 Q 1074 620 1078 612 Z" fill="url(#roofSnow)" />

				<rect x="1194" y="556" width="22" height="22" fill="#ffc46b" />
				<path d="M1205 556 V578 M1194 567 H1216" stroke="#5a3523" stroke-width="2.5" />

				<rect x="1128" y="628" width="40" height="34" fill="#ffc46b" />
				<path d="M1148 628 V662 M1128 645 H1168" stroke="#5a3523" stroke-width="3" />
				<rect x="1124" y="624" width="48" height="42" fill="none" stroke="#3a2117" stroke-width="4" />
				<rect x="1124" y="664" width="48" height="6" rx="2" fill="#f3efff" />

				<rect x="1242" y="628" width="40" height="34" fill="#ffc46b" />
				<path d="M1262 628 V662 M1242 645 H1282" stroke="#5a3523" stroke-width="3" />
				<rect x="1238" y="624" width="48" height="42" fill="none" stroke="#3a2117" stroke-width="4" />
				<rect x="1238" y="664" width="48" height="6" rx="2" fill="#f3efff" />

				<rect x="1188" y="640" width="34" height="70" fill="#3a2117" />
				<rect x="1192" y="644" width="26" height="66" fill="#6e4230" />
				<circle cx="1213" cy="678" r="2.5" fill="#ffc46b" />

				<path d="M1090 714 Q 1110 696 1140 706 Q 1170 698 1188 710 L1188 716 L1090 716 Z" fill="#eeeafb" />
				<path d="M1222 710 Q 1250 696 1280 706 Q 1305 698 1322 714 L1322 716 L1222 716 Z" fill="#eeeafb" />
				<ellipse cx="1205" cy="716" rx="140" ry="10" fill="#e9e4f8" />
			</g>

			<g id="frontTrees"></g>

			<ellipse cx="930" cy="772" rx="110" ry="18" fill="url(#shadow)" />
			<rect width="1920" height="1096" fill="url(#vignette)" />
		</svg>

		<canvas id="fx"></canvas>

		<script>
			(function () {
				var B = window.Backdrop;
				var rand = B.rand;

				var logEnds = document.getElementById('logEnds');
				for (var y = 607; y <= 705; y += 14) {
					B.el('circle', { cx: 1108, cy: y, r: 5 }, logEnds);
					B.el('circle', { cx: 1302, cy: y, r: 5 }, logEnds);
				}

				var twinklers = B.stars(document.getElementById('stars'), 140, { x: 380, y: 280, w: 1300, h: 260 }, 6);

				var farTrees = document.getElementById('farTrees');
				for (var f = 0; f < 46; f++) {
					B.pine(farTrees, 380 + rand() * 1320, 664 + rand() * 6, 40 + rand() * 40, '#2e2350', '#9f93cc');
				}

				var backTrees = document.getElementById('backTrees');
				[[1350, 700, 210], [1395, 690, 160], [1060, 690, 150], [1440, 712, 250], [560, 690, 180], [770, 684, 140]].forEach(function (t) {
					B.pine(backTrees, t[0], t[1], t[2], '#1f1736', '#ddd6f3');
				});

				var frontTrees = document.getElementById('frontTrees');
				[[520, 760, 330], [640, 735, 250], [1500, 770, 340], [1560, 740, 260]].forEach(function (t) {
					B.pine(frontTrees, t[0], t[1], t[2], '#170f29', '#f1edfc');
				});

				var snow = B.makeFall();
				var smoke = B.makeSmoke(1265, 500);
				var windows = [[1148, 645, 60], [1262, 645, 60], [1205, 567, 36]];

				B.run(function (ctx, dt, time) {
					B.drawTwinkle(ctx, twinklers, time);

					for (var w = 0; w < windows.length; w++) {
						var flicker = 0.22 + 0.08 * Math.sin(time * 7.3 + w * 2.1) + 0.05 * Math.sin(time * 13.7 + w);
						B.glow(ctx, windows[w][0], windows[w][1], windows[w][2], '255, 190, 100', flicker);
					}

					smoke(ctx, dt);
					snow(ctx, dt, time);
				});
			})();
		</script>
	</body>
</html>
