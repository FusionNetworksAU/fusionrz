<!doctype html>
<html>
	<head>
		<meta charset="UTF-8">
		<!--
			Animated lobby backdrop: a snowy cabin at night. Rendered into a DUI
			and painted onto the quad behind the podium (main.lua
			drawBackdropThread), so it is a texture in the world, not the NUI.

			Drawn at 1920x1096 (config duiResolution). Only part of it is on
			screen at the podium camera's zoom:
			  visible area  x 486-1584, y 288-907
			  party's feet  ~(930, 770), the player covers x 860-990, y 420-770
			Scenery is static SVG painted once; only the snow, chimney smoke,
			window glow and star twinkle animate, on one canvas. No CSS filters:
			blur on a texture this size cost ~45 fps.
		-->
		<style>
			html, body {
				margin: 0;
				padding: 0;
				width: 100%;
				height: 100%;
				overflow: hidden;
				background: #1a1030;
			}

			svg, canvas {
				position: absolute;
				inset: 0;
				width: 100%;
				height: 100%;
				display: block;
			}
		</style>
	</head>
	<body>
		<svg id="scene" viewBox="0 0 1920 1096" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
			<defs>
				<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
					<stop offset="0" stop-color="#120a24" />
					<stop offset="0.35" stop-color="#24154a" />
					<stop offset="0.55" stop-color="#3d2670" />
					<stop offset="0.62" stop-color="#5a3d8f" />
				</linearGradient>

				<radialGradient id="moonGlow">
					<stop offset="0" stop-color="#e9ddff" stop-opacity="0.45" />
					<stop offset="0.35" stop-color="#b79cff" stop-opacity="0.15" />
					<stop offset="1" stop-color="#b79cff" stop-opacity="0" />
				</radialGradient>

				<linearGradient id="farRange" gradientUnits="userSpaceOnUse" x1="0" y1="470" x2="0" y2="640">
					<stop offset="0" stop-color="#a99ad6" />
					<stop offset="0.35" stop-color="#6c5a9e" />
					<stop offset="1" stop-color="#3a2a5e" />
				</linearGradient>

				<linearGradient id="nearRange" gradientUnits="userSpaceOnUse" x1="0" y1="570" x2="0" y2="680">
					<stop offset="0" stop-color="#7d6db0" />
					<stop offset="0.4" stop-color="#4a3a7a" />
					<stop offset="1" stop-color="#2a1e45" />
				</linearGradient>

				<linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
					<stop offset="0" stop-color="#c9bdf0" stop-opacity="0" />
					<stop offset="0.5" stop-color="#c9bdf0" stop-opacity="0.32" />
					<stop offset="1" stop-color="#c9bdf0" stop-opacity="0" />
				</linearGradient>

				<linearGradient id="ground" gradientUnits="userSpaceOnUse" x1="0" y1="640" x2="0" y2="1096">
					<stop offset="0" stop-color="#e4def6" />
					<stop offset="0.35" stop-color="#c7bde6" />
					<stop offset="1" stop-color="#8e82bd" />
				</linearGradient>

				<radialGradient id="warmSpill">
					<stop offset="0" stop-color="#ffb35c" stop-opacity="0.55" />
					<stop offset="1" stop-color="#ffb35c" stop-opacity="0" />
				</radialGradient>

				<radialGradient id="shadow">
					<stop offset="0" stop-color="#2a1a45" stop-opacity="0.45" />
					<stop offset="1" stop-color="#2a1a45" stop-opacity="0" />
				</radialGradient>

				<linearGradient id="logs" x1="0" y1="0" x2="0" y2="1">
					<stop offset="0" stop-color="#6b4532" />
					<stop offset="1" stop-color="#47291d" />
				</linearGradient>

				<linearGradient id="roofSnow" x1="0" y1="0" x2="0" y2="1">
					<stop offset="0" stop-color="#ffffff" />
					<stop offset="1" stop-color="#d6cfee" />
				</linearGradient>

				<radialGradient id="vignette" cx="0.5" cy="0.55" r="0.62">
					<stop offset="0.6" stop-color="#0a0414" stop-opacity="0" />
					<stop offset="1" stop-color="#0a0414" stop-opacity="0.7" />
				</radialGradient>
			</defs>

			<rect width="1920" height="1096" fill="url(#sky)" />
			<g id="stars"></g>

			<!-- Moon, top left of the visible area, clear of the TEAM label. -->
			<circle cx="660" cy="410" r="170" fill="url(#moonGlow)" />
			<circle cx="660" cy="410" r="40" fill="#f4eeff" />
			<circle cx="648" cy="400" r="7" fill="#ddd2f5" />
			<circle cx="672" cy="424" r="5" fill="#e3d9f7" />

			<path fill="url(#farRange)" d="M0 660 L120 560 L260 610 L420 505 L560 590 L700 520 L860 600 L990 485 L1120 580 L1260 515 L1420 600 L1560 475 L1720 570 L1920 520 L1920 680 L0 680 Z" />
			<path fill="url(#nearRange)" d="M0 675 L200 605 L340 640 L520 575 L700 650 L880 610 L1060 655 L1260 600 L1460 645 L1660 590 L1920 640 L1920 690 L0 690 Z" />
			<rect x="0" y="600" width="1920" height="110" fill="url(#mist)" />

			<g id="farTrees"></g>

			<path fill="url(#ground)" d="M0 668 Q 300 640 620 662 T 1240 660 T 1920 652 L1920 1096 L0 1096 Z" />

			<g id="backTrees"></g>

			<!-- Cabin, right of the party. -->
			<g id="cabin">
				<ellipse cx="1150" cy="745" rx="120" ry="34" fill="url(#warmSpill)" />
				<ellipse cx="1262" cy="745" rx="110" ry="30" fill="url(#warmSpill)" />

				<rect x="1252" y="508" width="26" height="80" fill="#3f2a22" />
				<rect x="1248" y="502" width="34" height="10" rx="3" fill="#f3efff" />

				<rect x="1110" y="600" width="190" height="110" fill="url(#logs)" />
				<g stroke="#3a2117" stroke-width="2" opacity="0.7">
					<line x1="1110" y1="614" x2="1300" y2="614" />
					<line x1="1110" y1="628" x2="1300" y2="628" />
					<line x1="1110" y1="642" x2="1300" y2="642" />
					<line x1="1110" y1="656" x2="1300" y2="656" />
					<line x1="1110" y1="670" x2="1300" y2="670" />
					<line x1="1110" y1="684" x2="1300" y2="684" />
					<line x1="1110" y1="698" x2="1300" y2="698" />
				</g>
				<g fill="#5a3726">
					<circle cx="1108" cy="607" r="5" /><circle cx="1108" cy="621" r="5" /><circle cx="1108" cy="635" r="5" />
					<circle cx="1108" cy="649" r="5" /><circle cx="1108" cy="663" r="5" /><circle cx="1108" cy="677" r="5" />
					<circle cx="1108" cy="691" r="5" /><circle cx="1108" cy="705" r="5" />
					<circle cx="1302" cy="607" r="5" /><circle cx="1302" cy="621" r="5" /><circle cx="1302" cy="635" r="5" />
					<circle cx="1302" cy="649" r="5" /><circle cx="1302" cy="663" r="5" /><circle cx="1302" cy="677" r="5" />
					<circle cx="1302" cy="691" r="5" /><circle cx="1302" cy="705" r="5" />
				</g>

				<!-- Gable and roof. -->
				<path d="M1110 600 L1205 525 L1300 600 Z" fill="#55331f" />
				<path d="M1082 614 L1205 508 L1328 614 L1316 620 L1205 526 L1094 620 Z" fill="#3a2218" />
				<path d="M1078 612 L1205 500 L1332 612 Q 1334 622 1322 620 Q 1300 612 1290 618 Q 1270 606 1250 590 L1205 538 L1160 590 Q 1140 606 1120 618 Q 1108 612 1088 620 Q 1074 620 1078 612 Z" fill="url(#roofSnow)" />

				<!-- Attic window. -->
				<rect x="1194" y="556" width="22" height="22" fill="#ffc46b" />
				<path d="M1205 556 V578 M1194 567 H1216" stroke="#5a3523" stroke-width="2.5" />

				<!-- Windows and door; their glow is redrawn live on the canvas. -->
				<rect x="1128" y="628" width="40" height="34" fill="#ffc46b" />
				<path d="M1148 628 V662 M1128 645 H1168" stroke="#5a3523" stroke-width="3" />
				<rect x="1124" y="624" width="48" height="42" fill="none" stroke="#3a2117" stroke-width="4" />
				<rect x="1124" y="664" width="48" height="6" rx="2" fill="#f3efff" />

				<rect x="1242" y="628" width="40" height="34" fill="#ffc46b" />
				<path d="M1262 628 V662 M1242 645 H1282" stroke="#5a3523" stroke-width="3" />
				<rect x="1238" y="624" width="48" height="42" fill="none" stroke="#3a2117" stroke-width="4" />
				<rect x="1238" y="664" width="48" height="6" rx="2" fill="#f3efff" />

				<rect x="1188" y="640" width="34" height="70" fill="#3a2117" />
				<rect x="1192" y="644" width="26" height="66" fill="#6e4230" />
				<circle cx="1213" cy="678" r="2.5" fill="#ffc46b" />

				<!-- Snow drifts against the walls. -->
				<path d="M1090 714 Q 1110 696 1140 706 Q 1170 698 1188 710 L1188 716 L1090 716 Z" fill="#eeeafb" />
				<path d="M1222 710 Q 1250 696 1280 706 Q 1305 698 1322 714 L1322 716 L1222 716 Z" fill="#eeeafb" />
				<ellipse cx="1205" cy="716" rx="140" ry="10" fill="#e9e4f8" />
			</g>

			<g id="frontTrees"></g>

			<!-- Soft shadow where the party stands. -->
			<ellipse cx="930" cy="772" rx="110" ry="18" fill="url(#shadow)" />

			<rect width="1920" height="1096" fill="url(#vignette)" />
		</svg>

		<canvas id="fx"></canvas>

		<script>
			(function () {
				var SVG_NS = 'http://www.w3.org/2000/svg';
				var W = 1920;
				var H = 1096;

				// Seeded so the scenery is the same every time the lobby opens.
				var seed = 7;
				function rand() {
					seed = (seed * 16807) % 2147483647;
					return (seed - 1) / 2147483646;
				}

				function el(name, attrs, parent) {
					var node = document.createElementNS(SVG_NS, name);
					for (var key in attrs) {
						node.setAttribute(key, attrs[key]);
					}
					parent.appendChild(node);
					return node;
				}

				// Stars across the sky, mostly in the visible band.
				var stars = document.getElementById('stars');
				var twinklers = [];
				for (var i = 0; i < 140; i++) {
					var sx = 380 + rand() * 1300;
					var sy = 280 + rand() * 260;
					var sr = 0.6 + rand() * 1.6;
					if (i % 6 === 0) {
						twinklers.push({ x: sx, y: sy, r: sr + 0.6, phase: rand() * Math.PI * 2, speed: 0.8 + rand() * 1.6 });
					} else {
						el('circle', { cx: sx, cy: sy, r: sr, fill: '#efe8ff', opacity: (0.3 + rand() * 0.6).toFixed(2) }, stars);
					}
				}

				// A pine: stacked tiers, dark needles with snow on each tier.
				function pine(parent, x, base, height, colour, snow) {
					var width = height * 0.42;
					var tiers = 4;
					el('rect', { x: x - height * 0.025, y: base - height * 0.12, width: height * 0.05, height: height * 0.12, fill: '#24160f' }, parent);
					for (var t = 0; t < tiers; t++) {
						var top = base - height + t * height * 0.2;
						var bottom = base - height * 0.1 - (tiers - 1 - t) * height * 0.13;
						var half = width * (0.45 + t * 0.2) / 2;
						el('path', { d: 'M' + x + ' ' + top + ' L' + (x + half) + ' ' + bottom + ' L' + (x - half) + ' ' + bottom + ' Z', fill: colour }, parent);
						el('path', {
							d: 'M' + x + ' ' + top +
								' L' + (x + half * 0.55) + ' ' + (top + (bottom - top) * 0.55) +
								' Q ' + x + ' ' + (top + (bottom - top) * 0.42) + ' ' + (x - half * 0.55) + ' ' + (top + (bottom - top) * 0.55) + ' Z',
							fill: snow
						}, parent);
						el('path', {
							d: 'M' + (x - half) + ' ' + bottom + ' Q ' + x + ' ' + (bottom - 8) + ' ' + (x + half) + ' ' + bottom + ' Z',
							fill: snow, opacity: 0.85
						}, parent);
					}
				}

				var farTrees = document.getElementById('farTrees');
				for (var f = 0; f < 46; f++) {
					var fx = 380 + rand() * 1320;
					pine(farTrees, fx, 664 + rand() * 6, 40 + rand() * 40, '#2e2350', '#9f93cc');
				}

				var backTrees = document.getElementById('backTrees');
				[[1350, 700, 210], [1395, 690, 160], [1060, 690, 150], [1440, 712, 250], [560, 690, 180], [770, 684, 140]].forEach(function (t) {
					pine(backTrees, t[0], t[1], t[2], '#1f1736', '#ddd6f3');
				});

				var frontTrees = document.getElementById('frontTrees');
				[[520, 760, 330], [640, 735, 250], [1500, 770, 340], [1560, 740, 260]].forEach(function (t) {
					pine(frontTrees, t[0], t[1], t[2], '#170f29', '#f1edfc');
				});

				// ---- live layer -------------------------------------------------
				var canvas = document.getElementById('fx');
				var ctx = canvas.getContext('2d');
				var scale = 1;

				function resize() {
					canvas.width = window.innerWidth;
					canvas.height = window.innerHeight;
					scale = Math.max(canvas.width / W, canvas.height / H);
				}

				resize();
				window.addEventListener('resize', resize);

				// Three depths: far flakes are small and slow, near ones big and fast.
				var LAYERS = [
					{ count: 220, size: [0.8, 1.6], speed: [25, 45], alpha: 0.55 },
					{ count: 140, size: [1.6, 2.8], speed: [45, 75], alpha: 0.75 },
					{ count: 60, size: [3.0, 4.6], speed: [80, 120], alpha: 0.9 }
				];

				var flakes = [];
				LAYERS.forEach(function (layer, depth) {
					for (var n = 0; n < layer.count; n++) {
						flakes.push({
							x: Math.random() * W,
							y: Math.random() * H,
							r: layer.size[0] + Math.random() * (layer.size[1] - layer.size[0]),
							vy: layer.speed[0] + Math.random() * (layer.speed[1] - layer.speed[0]),
							sway: 10 + Math.random() * 25 * (depth + 1),
							phase: Math.random() * Math.PI * 2,
							alpha: layer.alpha * (0.6 + Math.random() * 0.4)
						});
					}
				});

				var smoke = [];
				var CHIMNEY = { x: 1265, y: 500 };
				var WINDOWS = [
					{ x: 1148, y: 645, r: 60 },
					{ x: 1262, y: 645, r: 60 },
					{ x: 1205, y: 567, r: 36 }
				];

				var running = true;
				var last = performance.now();
				var smokeTimer = 0;
				var time = 0;

				function frame(now) {
					if (!running) {
						return;
					}

					var dt = Math.min((now - last) / 1000, 0.1);
					last = now;
					time += dt;

					ctx.setTransform(1, 0, 0, 1, 0, 0);
					ctx.clearRect(0, 0, canvas.width, canvas.height);
					ctx.setTransform(scale, 0, 0, scale, (canvas.width - W * scale) / 2, (canvas.height - H * scale) / 2);

					// Star twinkle.
					for (var s = 0; s < twinklers.length; s++) {
						var star = twinklers[s];
						var a = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(time * star.speed + star.phase));
						ctx.globalAlpha = a;
						ctx.fillStyle = '#f6f0ff';
						ctx.beginPath();
						ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
						ctx.fill();
					}

					// Firelight flicker in the windows.
					ctx.globalCompositeOperation = 'lighter';
					for (var w = 0; w < WINDOWS.length; w++) {
						var win = WINDOWS[w];
						var flicker = 0.22 + 0.08 * Math.sin(time * 7.3 + w * 2.1) + 0.05 * Math.sin(time * 13.7 + w);
						var glow = ctx.createRadialGradient(win.x, win.y, 0, win.x, win.y, win.r);
						glow.addColorStop(0, 'rgba(255, 190, 100, ' + flicker.toFixed(3) + ')');
						glow.addColorStop(1, 'rgba(255, 190, 100, 0)');
						ctx.globalAlpha = 1;
						ctx.fillStyle = glow;
						ctx.fillRect(win.x - win.r, win.y - win.r, win.r * 2, win.r * 2);
					}
					ctx.globalCompositeOperation = 'source-over';

					// Chimney smoke.
					smokeTimer -= dt;
					if (smokeTimer <= 0) {
						smokeTimer = 0.35;
						smoke.push({ x: CHIMNEY.x, y: CHIMNEY.y, r: 8, life: 0 });
					}
					for (var p = smoke.length - 1; p >= 0; p--) {
						var puff = smoke[p];
						puff.life += dt;
						puff.y -= 22 * dt;
						puff.x += (14 + 6 * Math.sin(puff.life * 1.3)) * dt;
						puff.r += 7 * dt;
						var fade = 1 - puff.life / 6;
						if (fade <= 0) {
							smoke.splice(p, 1);
							continue;
						}
						ctx.globalAlpha = 0.28 * fade;
						ctx.fillStyle = '#d9d0ee';
						ctx.beginPath();
						ctx.arc(puff.x, puff.y, puff.r, 0, Math.PI * 2);
						ctx.fill();
					}

					// Snow.
					ctx.fillStyle = '#ffffff';
					for (var k = 0; k < flakes.length; k++) {
						var flake = flakes[k];
						flake.y += flake.vy * dt;
						flake.phase += dt * 0.8;
						if (flake.y > H + 6) {
							flake.y = -6;
							flake.x = Math.random() * W;
						}
						var x = flake.x + Math.sin(flake.phase) * flake.sway + time * 12 % W;
						x = ((x % W) + W) % W;
						ctx.globalAlpha = flake.alpha;
						ctx.beginPath();
						ctx.arc(x, flake.y, flake.r, 0, Math.PI * 2);
						ctx.fill();
					}

					ctx.globalAlpha = 1;
					requestAnimationFrame(frame);
				}

				requestAnimationFrame(frame);

				// main.lua pauses the page while the lobby is closed, so the DUI
				// does not keep animating in the background.
				window.addEventListener('message', function (event) {
					var data = event.data;

					if (typeof data === 'string') {
						try { data = JSON.parse(data); } catch (e) { return; }
					}

					if (!data || data.type !== 'setPaused') {
						return;
					}

					if (data.paused) {
						running = false;
					} else if (!running) {
						running = true;
						last = performance.now();
						requestAnimationFrame(frame);
					}
				});
			})();
		</script>
	</body>
</html>
