<!doctype html>
<html>
	<head>
		<meta charset="UTF-8">
		<!--
			Picks the lobby backdrop from web/backdrops/ by ?theme=:
			  normal | halloween | christmas | cabin | city | auto
			auto follows the calendar: October halloween, December christmas,
			January-February cabin, otherwise normal. Set in config/client.lua
			podium.backdrop.dui.
		-->
		<style>html, body { margin: 0; background: #1d0e29; }</style>
		<script>
			(function () {
				var THEMES = ['normal', 'halloween', 'christmas', 'cabin', 'city'];
				var theme = (new URLSearchParams(window.location.search).get('theme') || 'auto').toLowerCase();

				if (theme === 'auto') {
					var month = new Date().getMonth() + 1;

					if (month === 10) {
						theme = 'halloween';
					} else if (month === 12) {
						theme = 'christmas';
					} else if (month <= 2) {
						theme = 'cabin';
					} else {
						theme = 'normal';
					}
				}

				if (THEMES.indexOf(theme) === -1) {
					theme = 'normal';
				}

				window.location.replace('backdrops/' + theme + '.html');
			})();
		</script>
	</head>
	<body></body>
</html>
